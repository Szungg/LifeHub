version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lifehub-sqlserver-clean
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: Express
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_data_clean:/var/opt/mssql
    networks:
      - lifehub-network-clean

  backend:
    build:
      context: ./LifeHub-backend-clean
      dockerfile: Dockerfile
    container_name: lifehub-backend-clean
    ports:
      - "5001:8080"
    depends_on:
      - sqlserver
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=LifeHubDB;User=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY}
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - lifehub-network-clean

volumes:
  sqlserver_data_clean:

networks:
  lifehub-network-clean:
    driver: bridge
