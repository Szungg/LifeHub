version: '3.8'
services:
  backend:
    build:
      context: ./LifeHub.Api
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=LifeHubDB;User=sa;Password=Your_password123;TrustServerCertificate=True;
    ports:
      - "5000:80"
    depends_on:
      - db
    networks:
      - lifehub-net
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - lifehub-net
networks:
  lifehub-net:
    driver: bridge
